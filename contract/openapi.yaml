      tags: [controller]
      operationId: getNodeEndpoint
      summary: One endpoint of the node from the controller's image — its structure, no attribute values.
      description: |
        Read from the controller's image of the node, never from the node
        (no interaction, no admin): the device types of the Descriptor's
        DeviceTypeList, its TagList, the FixedLabel and UserLabel entries,
        the parts, BridgedDeviceBasicInformation Reachable, the device type
