    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      tags: [controller]
      operationId: interviewNode
      x-admin: true
      summary: Read the whole node again, without data version filters.
      responses:
        "204": { description: The node was read. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /controller/nodes/{id}/ping:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      tags: [controller]
      operationId: pingNode
      x-admin: true
      summary: Whether the node answers a Matter read, and how fast (0.5.0).
      description: |
        Not an ICMP echo. Where the node holds a session, the controller
        probes every address it knows for the node on its own — an empty
        read over that session sent to the address (go-fabric's
        `Node.PingAddress`, matter.js's probe with an address override;
        nothing migrates) — and answers `per_address: true` with one entry
        per address: `reachable`, `rtt_ms` and `error` each. The top-level
        `reachable` is then whether one address answered, `rtt_ms` the
        fastest round trip. A node without a session or without a known
        address keeps the single outcome: the controller reads its
        BasicInformation DataModelRevision (0x0028/0x0000) through the
        session, as go-fabric-server's `ping_node` does, and the one read
        stands for every address (`per_address: false`). A silent address
        or a failed read is `reachable: false`, not an error. 404 for an
        unknown node.
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PingResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /controller/nodes/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      tags: [controller]
      operationId: enableNode
      x-admin: true
      summary: Enable a disabled node — connect and subscribe again.
      responses:
        "204": { description: The node is enabled. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /controller/nodes/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      tags: [controller]
      operationId: disableNode
      x-admin: true
      summary: Disable the node — no connection, no subscription, kept on the fabric.
      responses:
        "204": { description: The node is disabled. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /controller/nodes/{id}/auto-subscribe:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      tags: [controller]
      operationId: setNodeAutoSubscribe
      x-admin: true
      summary: Turn the node's default subscription on or off.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoSubscribeRequest" }
      responses:
        "204": { description: The setting is applied. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /controller/nodes/{id}/window:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      tags: [controller]
      operationId: openNodeWindow
      x-admin: true
      summary: Open an enhanced commissioning window on the node for another administrator.
      description: The answer carries the window's passcode and codes; no event and no log line does.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeWindowRequest" }
      responses:
        "200":
          description: The window is open.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeWindow" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /controller/nodes/{id}/window/close:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      tags: [controller]
      operationId: closeNodeWindow
      x-admin: true
      summary: Revoke the node's commissioning window.
      responses:
        "204": { description: No window is open any more. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /controller/nodes/{id}/attributes:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      tags: [controller]
      operationId: readNodeAttributes
      summary: Read concrete attribute paths from the node.
      description: |
        A targeted read: every path names its endpoint, cluster and
        attribute (no wildcard, at most 32 paths). The value is the JSON
        rendering of the attribute by the cluster definitions, a struct
        keyed by field name; a path the node refused carries its status
        instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReadRequest" }
      responses:
        "200":
          description: One entry per path the node answered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttributeValueList" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
    put:
      tags: [controller]
      operationId: writeNodeAttribute
      x-admin: true
      summary: Write one attribute.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriteRequest" }
      responses:
        "200":
          description: The node's status for the write; a refusal is a status, not a problem.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /controller/nodes/{id}/commands:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      tags: [controller]
      operationId: invokeNodeCommand
      x-admin: true
      summary: Invoke one command.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvokeRequest" }
      responses:
        "200":
          description: The node's status and, when it answered with one, its response's fields.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvokeResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /controller/nodes/{id}/acl:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    get:
      tags: [controller]
      operationId: getNodeAcl
      summary: The node's access control entries of our fabric.
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AclEntryList" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
    put:
      tags: [controller]
      operationId: setNodeAcl
      x-admin: true
      summary: Replace our fabric's access control entries on the node.
      description: |
        The whole list is written in one write of the AccessControl `ACL`
        attribute. A list without an Administer entry for this controller
        locks it out of the node; the page warns before it sends one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AclEntryList" }
      responses:
        "200":
          description: The node's status for the write.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /controller/nodes/{id}/bindings:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    get:
      tags: [controller]
      operationId: getNodeBindings
      summary: The binding targets of every endpoint with a Binding cluster.
      responses:
        "200":
          description: The bindings by endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BindingList" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
    put:
      tags: [controller]
      operationId: setNodeBindings
      x-admin: true
      summary: Replace our fabric's binding targets on one endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EndpointBindings" }
      responses:
        "200":
          description: The node's status for the write.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /controller/nodes/{id}/icd:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    get:
      tags: [controller]
      operationId: getNodeIcd
      summary: The node's intermittently-connected-device state.
      responses:
        "200":
          description: The state; `supported` is false for a node without ICD Management.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcdState" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /controller/nodes/{id}/icd/register:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      tags: [controller]
      operationId: registerNodeIcd
      x-admin: true
      summary: Register this controller as the node's check-in client.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IcdRegisterRequest" }
      responses:
        "200":
          description: The state after the registration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcdState" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /controller/nodes/{id}/icd/unregister:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      tags: [controller]
      operationId: unregisterNodeIcd
      x-admin: true
      summary: Unregister this controller; with force, forget the registration without the node.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IcdUnregisterRequest" }
      responses:
        "200":
          description: The state after the unregistration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcdState" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /controller/nodes/{id}/fabrics:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    get:
      tags: [controller]
      operationId: listNodeFabrics
      summary: Every fabric on the node, ours marked.
      responses:
        "200":
          description: The fabrics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeFabricList" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /controller/nodes/{id}/fabrics/{index}:
    parameters:
      - $ref: "#/components/parameters/NodeID"
      - name: index
        in: path
        required: true
        schema: { type: integer, minimum: 1, maximum: 254 }
    delete:
      tags: [controller]
      operationId: removeNodeFabric
      x-admin: true
      summary: Remove another administrator's fabric from the node (RemoveFabric).
      description: Our own fabric is removed with `DELETE /controller/nodes/{id}`; naming it here is 400.
      responses:
        "204": { description: The fabric is removed. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /controller/commission:
    post:
      tags: [controller]
      operationId: commissionNode
      x-admin: true
      summary: Commission a device from a code or QR payload, or a discovered device and its passcode.
      description: |
        The answer arrives when the commissioning ends; the stream reports
        `commissioning_progress` meanwhile. The passcode and the code are
        never logged and never in an event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommissionRequest" }
      responses:
        "200":
          description: The commissioned node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControllerNodeDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: "terms_required (0.8.0): the device requires an accepted version of its terms and conditions; the problem carries `version`, `acknowledgements` and `deadline`, and a second request with `terms_and_conditions` commissions it."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /controller/discovery:
    get:
      tags: [controller]
      operationId: discoverDevices
      x-admin: true
      summary: Commissionable devices on the network.
      parameters:
        - name: filter
          in: query
          schema: { type: string, enum: [any, long_discriminator, short_discriminator, vendor, device_type] }
          description: What `value` selects by; absent is `any`.
        - name: value
          in: query
          schema: { type: integer, minimum: 0 }
          description: The discriminator, vendor id or device type; required with every filter but `any`.
        - name: timeout
          in: query
          schema: { type: integer, minimum: 1, maximum: 60 }
          description: How long to listen, in seconds; absent is 3.
      responses:
        "200":
          description: Every device that answered, each once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveredList" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /controller/credentials:
    get:
      tags: [controller]
      operationId: listCredentials
      summary: The stored Wi-Fi and Thread credentials, by name; never a secret.
      responses:
        "200":
          description: The credentials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialList" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    put:
      tags: [controller]
      operationId: setCredential
      x-admin: true
      summary: Store a Wi-Fi credential or a Thread dataset (write-only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialRequest" }
      responses:
        "204": { description: Stored. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [controller]
      operationId: removeCredential
      x-admin: true
      summary: Remove a stored credential.
      parameters:
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [wifi, thread] }
        - name: id
          in: query
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removed. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /controller/fabric/label:
    put:
      tags: [controller]
      operationId: setFabricLabel
      x-admin: true
      summary: The controller's fabric label, pushed to every node.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FabricLabelRequest" }
      responses:
        "204": { description: The label is set; the nodes get it in the background. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /controller/updates:
    get:
      tags: [controller]
      operationId: listUpdates
      summary: The software update queue.
      responses:
        "200":
          description: The queue; `available` is false when the controller runs no OTA provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateQueue" }
  /controller/updates/consent:
    post:
      tags: [controller]
      operationId: consentUpdate
      x-admin: true
      summary: Consent to one node's update to a version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConsentRequest" }
      responses:
        "204": { description: The consent is recorded. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /controller/updates/check:
    post:
      tags: [controller]
      operationId: checkUpdates
      x-admin: true
      summary: Ask every node for an available update.
      responses:
        "200":
          description: The updates the nodes can take.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailableUpdateList" }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /controller/topology:
    get:
      tags: [controller]
      operationId: getControllerTopology
      summary: The controller's network as a graph — its nodes and the links between them.
      description: |
        `family` is `controller`. Nodes are the controller (`node`), its
        commissioned nodes (`peer:<node_id_hex>`, `role` their Thread role
        or network — an Ethernet node is a `peer` with role `ethernet`, not
        the `ethernet` kind), the Thread neighbours no
        commissioned node matches (`unknown_<extended address>`,
        `thread_router` or `thread_end_device`, with `network_name` where
        go-fabric fills it), the Thread border routers go-fabric's
        border-router registry knows (`br_<extended address>`,
        `border_router`, 0.8.0: labelled by the mDNS host name, `ok` while
        the registry saw it within its 24-hour expiry, details
        `host_name`, `vendor_name`, `model_name`, `network_name`,
        `ext_address`, `ext_pan_id`, `last_seen`) and the Wi-Fi access
        points (`ap_<BSSID>`, `wifi_ap`). A node of a kind the go-fabric
        adapter does not know yet is drawn by its network, with its kind
        as the detail `kind`, never dropped — an `ethernet` node is such a
        node off Thread and Wi-Fi. Edges are a `session` from the
        controller to every commissioned node and a `link` per Thread pair
        and Wi-Fi station with its strength, LQI and RSSI.
        `refresh=true` re-reads the nodes' network diagnostics first and
        needs admin rights (403 without them); 501 `not_implemented` is a
        host whose controller serves no network graph.
      parameters:
        - { name: refresh, in: query, x-admin: true, schema: { type: boolean }, description: "Re-read the nodes' network diagnostics before answering; admin only." }
      responses:
        "200":
          description: The graph.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopologyGraph" }
        "403": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /controller/stream:
    get:
      tags: [controller]
      operationId: controllerStream
      summary: Server-sent events of the controller.
      description: |
        `event:` is one of node_added, node_updated, node_removed,
        connection, subscription, commissioning_progress, update,
        topology_changed; `data:` is a `ControllerEvent` (`{}` for
        topology_changed, which tells a page to reload
        `/controller/topology`). A comment line arrives every 15 s. No
        payload carries a passcode or a credential.
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string }
components:
  parameters:
    NodeKey:
      name: node
      in: path
      required: true
      description: The key of a device node as `GET /nodes` lists it (0.5.0).
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" }
    LogSince:
      name: since
      in: query
      description: The lowest record sequence number returned (inclusive); absent is every record the ring holds. A page passes the last number it has plus one.
      schema: { type: integer, minimum: 0 }
    LogLimit:
      name: limit
      in: query
      description: Only the newest `limit` of the matching records; absent is 200.
      schema: { type: integer, minimum: 1, maximum: 2000 }
    NodeID:
      name: id
      in: path
      required: true
      description: The node id as 16-digit hex (`node_id_hex`); case and leading zeros are free.
      schema: { type: string }
    EndpointNumber:
      name: ep
      in: path
      required: true
      description: The endpoint number.
      schema: { type: integer, minimum: 0, maximum: 65535 }
    EventSince:
      name: since
      in: query
      description: The lowest event number returned (inclusive); absent is every event the log holds. A page passes the last number it has plus one to fetch only the newer ones.
      schema: { type: integer, minimum: 0 }
    EventLimit:
      name: limit
      in: query
      description: Only the newest `limit` of the matching events; absent is 100.
      schema: { type: integer, minimum: 1, maximum: 1000 }
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum: [bad_request, forbidden, conflict, not_found, service_unready, internal, payload_too_large, node_error, not_implemented, node_limit, node_is_default, terms_required]
        version:
          type: integer
          minimum: 0
          maximum: 65535
          description: "terms_required (0.8.0): the device's TCMinRequiredVersion, the lowest version an acknowledgement has to name (go-fabric commissioner.TermsRequiredError.Version)."
        acknowledgements:
          type: ["integer", "null"]
          description: "terms_required (0.8.0): the acknowledgement bits the device requires; null, since no device attribute names them — the terms the user accepts set them."
        deadline:
          type: ["integer", "null"]
          minimum: 0
          description: "terms_required (0.8.0): the device's TCUpdateDeadline in Matter epoch seconds (from 2000-01-01T00:00:00Z), by which a commissioned device expects an updated acceptance; null when the attribute is null."
    Status:
      type: object
      required: [enabled, listening, endpoint_count, fabric_count, advertising, commissioning_window_open, exposure]
      properties:
        enabled: { type: boolean }
        listening: { type: boolean }
        listen_addr: { type: string }
        healthy: { type: boolean, description: Absent when the node runs no health probe. }
        health_note: { type: string }
        endpoint_count: { type: integer }
        fabric_count: { type: integer }
        enabled_count: { type: integer, description: Enabled selection items; absent without a selection. }
        advertising: { type: boolean }
        commissioning_window_open: { type: boolean }
        commissioning_window_duration_seconds: { type: integer }
        window_kind:
          type: string
          enum: [none, own, basic, enhanced]
          description: Which window is open — the node's own on its configured credentials, a basic one on fresh credentials, an administrator's enhanced one; absent without a node.
        window_deadline: { type: string, format: date-time, description: When the open window's timer closes it, on the node's clock; absent while no window is open. }
        exposure: { type: boolean, description: Whether the host serves a selection. }
        exposure_reason: { type: string, description: "Why the host serves no selection, in the host's language; absent when it serves one or gives no reason (0.5.0)." }
        csrf_token: { type: string, description: The admin token of token mode; absent when the host decides admin rights. }
        admin: { type: boolean, description: "Whether the host's admin check admits this request (0.6.0); present when the host decides admin rights, absent in token mode, where `csrf_token` says it." }
        node_registry: { type: boolean, description: "Whether the host keeps a node registry (0.6.0): `POST /nodes` creates a node and a `managed` node can be renamed and deleted. Absent without one." }
        config: { $ref: "#/components/schemas/NodeConfig" }
        attestation_error: { type: string, description: "Why the node's attestation files did not load (0.7.0, go-fabric `Node.AttestationError`): the node runs on the test chain and refuses every commissioning until the files are fixed and a new node is built. Absent when the files loaded, named nothing, or without a node." }
        boot_reason:
          type: integer
          minimum: 0
          maximum: 6
          description: "The GeneralDiagnostics BootReason the node was built with (0.7.0, go-fabric `Node.BootReason`; BootReasonEnum: 0 Unspecified, 1 PowerOnReboot, 2 BrownOutReset, 3 SoftwareWatchdogReset, 4 HardwareWatchdogReset, 5 SoftwareUpdateCompleted, 6 SoftwareReset). Absent without a node."
        erase: { type: boolean, description: "Whether the host wires an erase of this node (0.7.0, `Options.Erase` or `NodeEntry.Erase`): `POST /node/maintenance/erase` is served. Absent without one." }
        warnings:
          type: array
          description: The host's findings about its own configuration; absent when the host reports none (no Options.Warnings), empty when it finds nothing.
          items: { $ref: "#/components/schemas/Warning" }
        counters:
          type: array
          description: "The host's own counters a scraper reads beside the health (0.8.0), e.g. `discards`, commands the host answered with success and acted on nothing; absent when the host reports none (no Options.Counters), empty when it has none to report. Host-wide: every node's status carries the same list."
          items: { $ref: "#/components/schemas/Counter" }
        surface:
          type: object
          description: The policies the node's served surface is composed under (go-fabric node.Node.Surface) and the counts that tell whether to look further; absent without a node.
          required: [level, level_origin, profiles, extensions, assembled, withheld_count, warning_count, changed_count]
          properties:
            level: { type: string, description: "The specification level the surface is composed at (go-fabric surface.Report.Level), e.g. \"1.6.1\"." }
            level_origin: { type: string, description: "\"explicit\", \"profile <name>[, <name>…]\" or \"pin\" (surface.Report.LevelOrigin)." }
            profiles: { type: array, items: { type: string }, description: "The selected controller profiles, sorted." }
            extensions: { type: array, items: { type: string }, description: "The enabled ahead-of-matter.js register IDs, sorted." }
            assembled: { type: boolean, description: "The report reads the assembled topology (after the first assembly)." }
            withheld_count: { type: integer, description: "Elements the level policy withheld an endpoint for." }
            warning_count: { type: integer, description: "Warn decisions: elements a policy keeps and flags (surface.Warn)." }
            changed_count: { type: integer, description: "Surface changes announced in this process (ConfigurationVersion raised)." }
    Warning:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: "The kind of finding, stable across host releases." }
        message: { type: string, description: "What is wrong, in the host's language." }
        since: { type: string, format: date-time, description: "When the host first saw it; absent when unknown." }
    Counter:
      type: object
      description: "One of the host's counters (0.8.0, Options.Counters)."
      required: [code, value, message]
      properties:
        code: { type: string, description: "The counter's stable machine name, e.g. discards." }
        value: { type: integer, minimum: 0, description: The count since the host started. }
        message: { type: string, description: "What the counter counts, in one line in the host's language." }
    Fabric:
      type: object
      required: [fabric_index, fabric_id, fabric_id_hex, node_id, node_id_hex, vendor_id, vendor_name, compressed_id, root_public_key]
      properties:
        fabric_index: { type: integer }
        fabric_id: { type: integer, description: Informational; use fabric_id_hex. }
        fabric_id_hex: { type: string }
        node_id: { type: integer, description: Informational; use node_id_hex. }
        node_id_hex: { type: string }
        vendor_id: { type: integer }
        vendor_name: { type: string }
        label: { type: string }
        compressed_id: { type: string }
        root_public_key: { type: string }
    FabricList:
      type: object
      required: [fabrics]
      properties:
        fabrics:
          type: array
          items: { $ref: "#/components/schemas/Fabric" }
    Pairing:
      type: object
      required: [qr_code, manual_code, source, window_open]
      properties:
        discriminator: { type: integer, description: "The discriminator the codes encode: of the window this handler opened on fresh credentials, else the configured one. Absent from servers before 0.1.2 for the configured source." }
        passcode: { type: integer, description: "The passcode the codes encode: of the window this handler opened on fresh credentials, else the configured one. Absent from servers before 0.1.2 for the configured source." }
        qr_code: { type: string }
        manual_code: { type: string }
        source: { type: string, enum: [configured, window] }
        window_open: { type: boolean }
        duration_seconds: { type: integer }
    WindowRequest:
      type: object
      properties:
        duration_seconds: { type: integer, description: "180..900; 0 or absent is 900." }
    Window:
      type: object
      required: [duration_seconds, qr_code, manual_code]
      properties:
        discriminator: { type: integer, description: "The window's discriminator; absent from servers before 0.1.2 for a window on the configured credentials." }
        passcode: { type: integer, description: "The window's passcode; absent from servers before 0.1.2 for a window on the configured credentials." }
        duration_seconds: { type: integer }
        qr_code: { type: string }
        manual_code: { type: string }
    Cluster:
      type: object
      description: One cluster server mounted on the endpoint, in its Descriptor's ServerList order.
      required: [id]
      properties:
        id: { type: integer }
        name: { type: string, description: The schema's cluster name; absent for a cluster the schema does not know. }
        revision: { type: integer, description: The schema's ClusterRevision; absent for a cluster the schema does not know. }
    Endpoint:
      type: object
      required: [endpoint_id, parent_endpoint_id, device_type, device_type_name, reachable, name, source, clusters]
      properties:
        endpoint_id: { type: integer }
        parent_endpoint_id: { type: integer }
        device_type: { type: integer }
        device_type_name: { type: string }
        device_type_revision: { type: integer, description: The revision the endpoint's Descriptor serves for its device type; absent for a type the schema does not know. }
        reachable: { type: boolean }
        name: { type: string }
        source:
          type: object
          description: Opaque identity of the host's source; `key` is the endpoint's stable key.
          additionalProperties: { type: string }
        clusters:
          type: array
          items: { $ref: "#/components/schemas/Cluster" }
    EndpointList:
      type: object
      required: [endpoints]
      properties:
        endpoints:
          type: array
          items: { $ref: "#/components/schemas/Endpoint" }
        structural:
          type: array
          description: The root and the Aggregator — the endpoints `endpoints` does not list — root first, then by number (0.5.0).
          items: { $ref: "#/components/schemas/StructuralEndpoint" }
    StructuralEndpoint:
      type: object
      description: An endpoint of the node's endpoint tree no bridged device declares (go-fabric `Node.Endpoints`, 0.5.0).
      required: [endpoint_id, name, device_types, parts]
      properties:
        endpoint_id: { type: integer }
        parent_endpoint_id: { type: integer, description: The endpoint whose parts list names this one; absent for the root and top-level endpoints. }
        name: { type: string, description: "The endpoint's node label; its first device type's name without one." }
        device_types:
          type: array
          description: The Descriptor's DeviceTypeList in its order.
          items: { $ref: "#/components/schemas/EndpointDeviceType" }
        parts:
          type: array
          description: The endpoint numbers of its direct children — the endpoints whose parent it is, not every descendant its PartsList names.
          items: { type: integer }
    Session:
      type: object
      required: [session_id, fabric_index, peer_node_id, peer_node_id_hex, local_node_id, local_node_id_hex, is_pase, subscriptions, last_activity, last_peer_activity, idle_seconds, peer_idle_seconds]
      properties:
        session_id: { type: integer }
        fabric_index: { type: integer }
        peer_node_id: { type: integer, description: Informational; use peer_node_id_hex. }
        peer_node_id_hex: { type: string }
        local_node_id: { type: integer, description: Informational; use local_node_id_hex. }
        local_node_id_hex: { type: string }
        is_pase: { type: boolean }
        subscriptions: { type: integer }
        last_activity: { type: string, format: date-time }
        last_peer_activity: { type: string, format: date-time }
        idle_seconds: { type: integer }
        peer_idle_seconds: { type: integer }
    Occupancy:
      type: object
      required: [live, reserved, capacity, free]
      properties:
        live: { type: integer }
        reserved: { type: integer }
        capacity: { type: integer }
        free: { type: integer }
    SessionList:
      type: object
      required: [sessions, occupancy]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/Session" }
        occupancy: { $ref: "#/components/schemas/Occupancy" }
        parameters: { $ref: "#/components/schemas/SessionParameters" }
    SessionParameters:
      type: object
      description: "The session parameters the node reports to every PASE and CASE peer (0.7.0, go-fabric `Node.SessionParameters`, the SessionParameters structure of PBKDFParamResponse and Sigma2). A zero value is not stated: the peer falls back to the specification's default."
      required: [idle_interval_ms, active_interval_ms, active_threshold_ms, data_model_revision, interaction_model_revision, specification_version_hex, max_paths_per_invoke, supported_transports, tcp]
      properties:
        idle_interval_ms: { type: integer, description: SESSION_IDLE_INTERVAL. }
        active_interval_ms: { type: integer, description: SESSION_ACTIVE_INTERVAL. }
        active_threshold_ms: { type: integer, description: SESSION_ACTIVE_THRESHOLD. }
        data_model_revision: { type: integer }
        interaction_model_revision: { type: integer }
        specification_version_hex: { type: string, description: "SPECIFICATION_VERSION as 8 uppercase hex digits, e.g. \"01050000\"." }
        max_paths_per_invoke: { type: integer }
        supported_transports: { type: integer, description: The SUPPORTED_TRANSPORTS bitmap, the transports beside MRP over UDP. }
        tcp: { type: boolean, description: The bitmap names TCP in either role. }
        max_tcp_message_size: { type: integer, description: MAX_TCP_MESSAGE_SIZE in bytes; present with tcp. }
    TopologyGraph:
      type: object
      description: A family's topology as nodes and edges; the renderer needs no knowledge per kind.
      required: [as_of, family, nodes, edges]
      properties:
        as_of: { type: string, format: date-time, description: When the graph was read, on the node's or the controller's clock. }
        family: { type: string, enum: [node, controller] }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/TopologyNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/TopologyEdge" }
    TopologyNode:
      type: object
      description: |
        One node of the graph. `details` is the ordered list a page shows
        for it; the typed fields are the ones a page links or colours by,
        each present only for the kinds it belongs to.
      required: [id, kind, label, state, details]
      properties:
        id: { type: string, description: "Unique in the graph: `node`, `ep:<n>`, `fabric:<index>`, `session:<id>`, `peer:<node_id_hex>`." }
        kind: { type: string, enum: [node, aggregator, device, part, fabric, session, peer, thread_router, thread_end_device, wifi_ap, ethernet, border_router] }
        label: { type: string }
        state: { type: string, enum: [ok, unreachable, idle, unknown] }
        ref: { $ref: "#/components/schemas/TopologyRef" }
        details:
          type: array
          items: { $ref: "#/components/schemas/TopologyDetail" }
        endpoint: { type: integer, description: "aggregator, device, part: the endpoint number." }
        fabric_index: { type: integer, description: "fabric, session: the fabric index; 0 for a PASE session." }
        session_id: { type: integer, description: "session: the local session id." }
        node_id_hex: { type: string, description: "fabric: our node id on it; session: the peer's; peer: the node's." }
        reachable: { type: boolean, description: "device, part: Reachable as a controller reads it." }
        is_pase: { type: boolean, description: "session: a commissioning (PASE) session." }
        subscriptions: { type: integer, description: "session: the subscriptions riding on it." }
        role: { type: string, description: "peer: its Thread routing role or network kind." }
        rloc16: { type: integer, description: "peer: its Thread RLOC16." }
        ssid: { type: string, description: "wifi_ap, peer: the Wi-Fi network." }
        bssid: { type: string, description: "wifi_ap, peer: the access point's BSSID." }
    TopologyEdge:
      type: object
      required: [source, target, kind]
      properties:
        source: { type: string, description: A node id. }
        target: { type: string, description: A node id. }
        kind: { type: string, enum: [contains, session, link] }
        strength: { type: string, enum: [strong, medium, weak, none, unknown], description: "link: the link's quality class; `none` is a link observed dead (LQI 0), `unknown` one without a measurement." }
        lqi: { type: integer, description: "link: Thread link quality indicator." }
        rssi: { type: integer, description: "link: received signal strength, dBm." }
        label: { type: string }
    TopologyRef:
      type: object
      description: |
        The page that already lists the node and the id it lists it by:
        `endpoints` (endpoint number), `fabrics` (fabric index),
        `diagnostics` (session id), `controller_node` (`node_id_hex`).
      required: [page, id]
      properties:
        page: { type: string }
        id: { type: string }
    TopologyDetail:
      type: object
      required: [key, value]
      properties:
        key: { type: string, description: "A stable key a page translates (`device_type`, `clusters`, …)." }
        value: { type: string }
    MdnsService:
      type: object
      required: [service_type, instance_name, host_name, port, addresses, subtypes, txt]
      properties:
        service_type: { type: string }
        instance_name: { type: string }
        host_name: { type: string }
        port: { type: integer }
        addresses: { type: array, items: { type: string } }
        subtypes: { type: array, items: { type: string } }
        txt: { type: object, additionalProperties: { type: string } }
    MdnsFinding:
      type: object
      required: [severity, code, message]
      properties:
        severity: { type: string, enum: [error, warning] }
        code: { type: string }
        message: { type: string }
        service: { type: string }
    Mdns:
      type: object
      required: [advertising, services, findings]
      properties:
        advertising: { type: boolean }
        services:
          type: array
          items: { $ref: "#/components/schemas/MdnsService" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/MdnsFinding" }
    Ecosystem:
      type: object
      required: [ecosystem, vendor_id, fabric_index]
      properties:
        ecosystem: { type: string }
        vendor_id: { type: integer }
        fabric_index: { type: integer }
        label: { type: string }
    CompatFinding:
      type: object
      required: [ecosystem, code, message]
      properties:
        ecosystem: { type: string }
        code: { type: string }
        message: { type: string }
        device_type: { type: integer }
    Compatibility:
      type: object
      required: [ecosystems, endpoint_count, findings]
      properties:
        ecosystems:
          type: array
          items: { $ref: "#/components/schemas/Ecosystem" }
        endpoint_count: { type: integer }
        findings:
          type: array
          items: { $ref: "#/components/schemas/CompatFinding" }
    DiagnosticEvent:
      type: object
      required: [at, kind, severity, message]
      properties:
        at: { type: string, format: date-time }
        kind: { type: string, enum: [pairing, session, discovery] }
        severity: { type: string, enum: [info, warning, error] }
        message: { type: string }
        detail: { type: object, additionalProperties: { type: string } }
    HealthSampleEvent:
      type: object
      description: The payload of health_sample (0.5.0) — one verdict of the node's health probe.
      required: [healthy, note, sampled_at]
      properties:
        healthy: { type: boolean }
        note: { type: string, description: "The probe's stable English note." }
        sampled_at: { type: string, format: date-time, description: "When the handler received the verdict, on the node's clock." }
    NodeSummary:
      type: object
      required: [key, label, enabled, managed, exposure]
      properties:
        key: { type: string, description: "The node's stable key, the `{node}` of `/nodes/{node}/…`." }
        label: { type: string, description: "The host's name for the node; the key when the host names none." }
        kind: { type: string, description: "What the host says the node is (\"bridge\", \"device\"); absent when it says nothing." }
        enabled: { type: boolean, description: "Whether the node family is served for the node, as the node's `Status.enabled`." }
        managed: { type: boolean, description: "Whether the node belongs to the host's node registry (0.6.0): `PUT /nodes/{node}/label` and `DELETE /nodes/{node}` apply to it. The default node is the host's configuration and never managed." }
        exposure: { type: boolean, description: "Whether the node serves a selection (0.6.0), as its `Status.exposure`." }
    NodeConfig:
      type: object
      description: |
        The node's configuration as the host shows it, read-only (0.6.0);
        absent when the host supplies none. One shape for every node. It
        never carries the passcode, which stays with the admin route
        `GET /node/pairing`. Of a `registry` node only the label is
        editable (`PUT /nodes/{node}/label`); the host allocated the rest.
        A `configuration` node is set in the host's configuration and
        nothing of it is editable in the page.
      required: [source, listen, discriminator, vendor_id, product_id]
      properties:
        source: { type: string, enum: [configuration, registry], description: "Where the values come from: the host's configuration, or its node registry." }
        source_note: { type: string, description: "The host's wording of where a configured node's values come from (\"add-on options\", \"the --bridge-* flags\"); absent when it gives none." }
        label: { type: string, description: The node's configured name; absent when it has none. }
        listen: { type: string, description: "The address the node listens on, as configured (\"[::]:5540\")." }
        discriminator: { type: integer, minimum: 0, maximum: 4095 }
        vendor_id: { type: integer, minimum: 0, maximum: 65535 }
        vendor_name: { type: string }
        product_id: { type: integer, minimum: 0, maximum: 65535 }
        product_name: { type: string }
        store: { type: string, description: Where the node keeps its state (a file name); absent when the host does not say. }
    NodeLabelRequest:
      type: object
      description: The body of `POST /nodes` and `PUT /nodes/{node}/label` (0.6.0); an unknown field is refused.
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 64, description: "The operator's name for the node, trimmed: 1 to 64 characters, no control character." }
    NodesChangedEvent:
      type: object
      description: The payload of nodes_changed (0.6.0) — the keys of the nodes created, renamed or deleted.
      required: [keys]
      properties:
        keys: { type: array, items: { type: string } }
    NodeSummaryList:
      type: object
      required: [nodes]
      properties:
        nodes:
          type: array
          description: The default node first.
          items: { $ref: "#/components/schemas/NodeSummary" }
    LogLevel:
      type: object
      required: [level, levels]
      properties:
        level: { type: string, enum: [debug, info, warn, error], description: "The level in force; a level between two names is the lower one." }
        levels: { type: array, items: { type: string, enum: [debug, info, warn, error] }, description: "The levels the daemon accepts, lowest first." }
    LogLevelRequest:
      type: object
      required: [level]
      properties:
        level: { type: string, enum: [debug, info, warn, error] }
    LogRecord:
      type: object
      required: [seq, time, level, msg, attrs]
      properties:
        seq: { type: integer, minimum: 1, description: "The record's sequence number, increasing by one per record the ring takes." }
        time: { type: string, format: date-time }
        level: { type: string, enum: [debug, info, warn, error] }
        msg: { type: string }
        attrs: { type: object, additionalProperties: { type: string }, description: "The record's attributes as text, a group's by dotted key." }
    LogRecordList:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/LogRecord" }
    OperationInfo:
      type: object
      required: [version, go_fabric, uptime_s, started_at]
      properties:
        version: { type: string, description: "The daemon's version, as its host names it." }
        go_fabric: { type: string, description: "The go-fabric module version the daemon is built with; empty when the build does not say." }
        uptime_s: { type: integer, minimum: 0, description: "Seconds since started_at." }
        started_at: { type: string, format: date-time }
    PingResult:
      type: object
      required: [method, per_address, reachable, addresses]
      properties:
        method: { type: string, enum: [matter-read], description: "What was measured: a Matter read — an empty read per address, or BasicInformation DataModelRevision through the session — not an ICMP echo." }
        per_address: { type: boolean, description: "Whether each address was probed on its own; false when one read through the node's session stands for every address." }
        reachable: { type: boolean, description: "Whether the read answered; with per_address, whether one address answered." }
        rtt_ms: { type: number, minimum: 0, description: "The read's round trip in milliseconds, with per_address the fastest address's; absent when it failed." }
        error: { type: string, description: "Why the read failed, with per_address why no address answered; absent when it answered." }
        addresses:
          type: array
          description: "The addresses the controller knows for the node, each with the outcome that applies to it."
          items: { $ref: "#/components/schemas/PingAddress" }
    PingAddress:
      type: object
      required: [ip, reachable]
      properties:
        ip: { type: string, description: "The address with its port, as `ControllerNodeDetail.record.addresses` lists it." }
        reachable: { type: boolean }
        rtt_ms: { type: number, minimum: 0, description: "This address's round trip in milliseconds; absent when it did not answer." }
        error: { type: string, description: "Why this address did not answer; absent when it answered (0.5.0)." }
    DiagnosticEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/DiagnosticEvent" }
    Column:
      type: object
      required: [key, label, filter]
      properties:
        key: { type: string }
        label: { type: string }
        filter: { type: boolean, description: Offer a value filter built from the listed values. }
        multi: { type: boolean, description: "Default false. The field is list-valued: its values are the item's lists entry for the key (or, deprecated until v0.2.0, the comma split of its fields entry when lists has no such key); shown as chips, filtered by membership, the filter's options built from the individual values." }
    FilterOption:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }
    Filter:
      type: object
      required: [field, label, options]
      properties:
        field: { type: string }
        label: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/FilterOption" }
        multi: { type: boolean, description: "Default false. Match by membership in the item's list for the field (its lists entry, or, deprecated until v0.2.0, the comma split of its fields entry, values trimmed; an empty value never matches) instead of equality." }
    ExposureSchema:
      type: object
      required: [columns, groups, filters]
      properties:
        columns:
          type: array
          items: { $ref: "#/components/schemas/Column" }
        groups: { type: boolean }
        filters:
          type: array
          items: { $ref: "#/components/schemas/Filter" }
    Verdict:
      type: object
      required: [state, device_type, device_type_name, clusters, reason]
      properties:
        state: { type: string, enum: [mappable, partially_mappable, unmappable] }
        device_type: { type: integer }
        device_type_name: { type: string }
        clusters: { type: array, items: { type: integer } }
        reason: { type: string }
    Item:
      type: object
      required: [key, name, group, fields, verdict, enabled, source]
      properties:
        key: { type: string }
        name: { type: string }
        group: { type: string }
        fields: { type: object, additionalProperties: { type: string } }
        lists:
          type: object
          description: "Optional. The values of list-valued (multi) fields, by field key: one entry per value, no separator semantics, so a value may contain a comma. Wins over the comma-separated fields entry of the same key."
          additionalProperties: { type: array, items: { type: string } }
        verdict: { $ref: "#/components/schemas/Verdict" }
        enabled: { type: boolean }
        source: { type: string, description: Where the verdict comes from, in the host's words. }
    ItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
    Update:
      type: object
      required: [key, enabled]
      properties:
        key: { type: string }
        enabled: { type: boolean }
        name: { type: string, description: Renames the item; absent leaves the name. }
    UpdateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Update" }
    Applied:
      type: object
      required: [applied]
      properties:
        applied: { type: integer }
    FactoryResetRequest:
      type: object
      required: [confirm]
      properties:
        confirm: { type: string, const: remove-all-fabrics }
    EraseRequest:
      type: object
      required: [confirm]
      properties:
        confirm: { type: string, const: erase-node }
    FabricEvent:
      type: object
      required: [fabric_index]
      properties:
        fabric_index: { type: integer }
        vendor_id: { type: integer }
        vendor_name: { type: string }
        label: { type: string }
    WindowEvent:
      type: object
      properties:
        discriminator: { type: integer }
        duration_seconds: { type: integer }
    SessionEvent:
      description: The payload of session_opened, session_closed and subscriptions_changed — the session as `/node/sessions` lists it, with its new subscription count.
      type: object
      required: [session_id, fabric_index, peer_node_id, peer_node_id_hex, local_node_id, local_node_id_hex, is_pase, subscriptions, last_activity, last_peer_activity, idle_seconds, peer_idle_seconds]
      properties:
        session_id: { type: integer }
        fabric_index: { type: integer }
        peer_node_id: { type: integer, description: Informational; use peer_node_id_hex. }
        peer_node_id_hex: { type: string }
        local_node_id: { type: integer, description: Informational; use local_node_id_hex. }
        local_node_id_hex: { type: string }
        is_pase: { type: boolean }
        subscriptions: { type: integer }
        last_activity: { type: string, format: date-time }
        last_peer_activity: { type: string, format: date-time }
        idle_seconds: { type: integer }
        peer_idle_seconds: { type: integer }
    ExposureEvent:
      type: object
      required: [keys]
      properties:
        keys: { type: array, items: { type: string } }
    SurfaceChangedEvent:
      type: object
      required: [endpoints]
      properties:
        endpoints:
          type: array
          items: { type: string }
          description: The key of the endpoint whose served surface an assembly changed (go-fabric node.Observers.OnSurfaceChanged, one endpoint per event); "" is the root endpoint.
    AttributeChangedEvent:
      type: object
      description: The payload of attribute_changed (0.4.1) — go-fabric node.Observers.OnAttributeChanged, one cluster of one endpoint per event, ids only.
      required: [endpoint, cluster_hex, attributes]
      properties:
        endpoint: { type: integer }
        cluster_hex: { type: string, description: 'The cluster id as `id_hex` elsewhere: "0x" and at least four uppercase hex digits.' }
        attributes:
          type: array
          description: The ids of the attributes that changed, ascending, in hex.
          items: { type: string }
    SurfaceReport:
      type: object
      description: go-fabric surface.Report (surface/policy.go wireReport).
      required: [assembled, changed, decisions, effective, extensions, level, level_origin, policies, profiles, withheld]
      properties:
        assembled: { type: boolean, description: 'The report reads the assembled topology.' }
        changed:
          type: array
          description: The surface changes announced in this process, oldest first (the node keeps the last hundred).
          items: { $ref: "#/components/schemas/SurfaceChange" }
        decisions:
          type: array
          description: Every decision of the policy chain, in its order.
          items: { $ref: "#/components/schemas/SurfaceDecision" }
        effective: { $ref: "#/components/schemas/SurfaceEffective" }
        extensions: { type: array, items: { type: string }, description: 'The enabled ahead-of-matter.js register IDs, sorted.' }
        level: { type: string, description: 'The specification level the surface is composed at.' }
        level_origin: { type: string, description: '"explicit", "profile <name>[, <name>…]" or "pin".' }
        policies: { type: string, description: 'The digest of the policies, 64 hex digits.' }
        profiles: { type: array, items: { type: string }, description: 'The selected controller profiles, sorted.' }
        withheld:
          type: array
          description: The elements the level policy withheld an endpoint for.
          items: { $ref: "#/components/schemas/SurfaceElement" }
    SurfaceEffective:
      type: object
      description: go-fabric surface.Surface (surface/surface.go wireSurface).
      required: [endpoints, root]
      properties:
        endpoints:
          type: array
          description: The endpoints other than the root, by key.
          items: { $ref: "#/components/schemas/SurfaceEndpoint" }
        root: { $ref: "#/components/schemas/SurfaceEndpoint" }
    SurfaceEndpoint:
      type: object
      required: [clusters, deviceTypes, key]
      properties:
        clusters:
          type: array
          description: The server clusters, by id.
          items: { $ref: "#/components/schemas/SurfaceCluster" }
        deviceTypes:
          type: array
          description: The device types in the Descriptor's order.
          items: { $ref: "#/components/schemas/SurfaceDeviceType" }
        key: { type: string, description: 'The endpoint''s rendered stable key; "" for the root, "aggregator" for the Aggregator, "@<number>" for an endpoint without a key.' }
        number: { type: integer, description: 'The endpoint number; absent until the endpoint is assembled, and for the root.' }
    SurfaceDeviceType:
      type: object
      required: [id, revision]
      properties:
        id: { type: string, description: 'Device type id, "0x" and four hex digits.' }
        revision: { type: integer }
    SurfaceCluster:
      type: object
      required: [accepted, attributes, events, featureMap, generated, id, revision]
      properties:
        accepted: { type: array, items: { type: string }, description: 'AcceptedCommandList, sorted.' }
        attributes: { type: array, items: { type: string }, description: 'AttributeList, sorted.' }
        events: { type: array, items: { type: string }, description: 'The events served, sorted.' }
        featureMap: { type: string }
        generated: { type: array, items: { type: string }, description: 'GeneratedCommandList, sorted.' }
        id: { type: string }
        revision: { type: integer, description: 'ClusterRevision.' }
    SurfaceElement:
      type: object
      description: One candidate element of an endpoint's surface (surface.Element).
      required: [cluster, endpoint, id, kind, mandatory, origin, reference]
      properties:
        cluster: { type: string, description: 'The cluster id; "0x00000000" for a device type.' }
        endpoint: { type: string, description: 'The endpoint''s key; "" for the root.' }
        id: { type: string, description: 'The device type id, the cluster id, the feature''s one-bit mask, or the attribute, command or event id.' }
        kind: { type: string, enum: [device-type, cluster, feature, attribute, command, event] }
        mandatory: { type: boolean, description: 'Removing the element would make the composition invalid at the pin.' }
        origin: { type: string, enum: [cluster-mandatory, device-type, host-declared, kit-default] }
        reference: { type: string, description: 'The ahead-of-matter.js register ID it is served against; "" for the matter.js baseline.' }
    SurfaceDecision:
      type: object
      description: One policy's judgement of one element (surface.Decision).
      required: [cluster, endpoint, id, kind, mandatory, origin, policy, reason, reference, verdict]
      properties:
        cluster: { type: string }
        endpoint: { type: string }
        id: { type: string }
        kind: { type: string, enum: [device-type, cluster, feature, attribute, command, event] }
        mandatory: { type: boolean }
        origin: { type: string, enum: [cluster-mandatory, device-type, host-declared, kit-default] }
        policy: { type: string, description: 'The policy''s name: "level", "reference", "profile:<name>" or a host''s own.' }
        reason: { type: string, description: 'Empty for a silent keep.' }
        reference: { type: string }
        verdict: { type: string, enum: [keep, warn, remove, refuse] }
    SurfaceChange:
      type: object
      description: One announced change of an endpoint's served surface (surface.SurfaceChange).
      required: [after, at, before, changes, endpoint]
      properties:
        after: { type: string, description: 'The new surface''s digest, 64 hex digits.' }
        at: { type: string, format: date-time, description: 'When the node raised the ConfigurationVersion.' }
        before: { type: string, description: 'The digest last persisted for the endpoint.' }
        changes:
          type: array
          description: The differences; empty when only the earlier digest was available.
          items: { $ref: "#/components/schemas/SurfaceElementChange" }
        endpoint: { type: string, description: 'The endpoint''s key.' }
    SurfaceElementChange:
      type: object
      description: One element-level difference (surface.Change).
      required: [after, before, cluster, endpoint, id, kind]
      properties:
        after: { type: string, description: 'The element''s state after ("revision 6", "set", "served", "accepted", "generated"); "" when it is gone.' }
        before: { type: string, description: 'The state before; "" when it is new.' }
        cluster: { type: string }
        endpoint: { type: string }
        id: { type: string }
        kind: { type: string, enum: [device-type, cluster, feature, attribute, command, event] }
    ControllerStatus:
      type: object
      required: [enabled, fabric_id_hex, compressed_fabric_id_hex, fabric_index, node_id_hex, vendor_id, vendor_name, label, node_count, capabilities]
      properties:
        enabled: { type: boolean, description: Always true; the route is absent without a controller. }
        fabric_id_hex: { type: string }
        compressed_fabric_id_hex: { type: string }
        fabric_index: { type: integer }
        node_id_hex: { type: string, description: The controller's own operational node id. }
        vendor_id: { type: integer }
        vendor_name: { type: string }
        label: { type: string }
        node_count: { type: integer }
        capabilities: { $ref: "#/components/schemas/ControllerCapabilities" }
        csrf_token: { type: string, description: The admin token of token mode, as on GET /node/status; absent when the host decides admin rights. }
    ControllerCapabilities:
      type: object
      required: [ota, credentials, ble]
      properties:
        ota: { type: boolean, description: The controller runs an OTA provider; the update routes answer. }
        credentials: { type: boolean, description: The host stores Wi-Fi and Thread credentials; the credential routes answer. }
        ble: { type: boolean, description: "The host has a Bluetooth LE central. A commissioning searches over it when the code allows BLE, `network_only` is off and the request names a credential; the `commissioning_progress` event's `ble` says what was decided (0.7.1)." }
    ConnectionState:
      type: string
      enum: [connected, disconnected, reconnecting, waiting_for_discovery]
    ControllerNodeSummary:
      type: object
      required: [node_id_hex, connection, subscription_active, disabled, icd, addresses]
      properties:
        node_id_hex: { type: string }
        vendor_id: { type: integer }
        vendor_name: { type: string }
        product_id: { type: integer }
        product_name: { type: string }
        node_label: { type: string }
        connection: { $ref: "#/components/schemas/ConnectionState" }
        subscription_active: { type: boolean }
        disabled: { type: boolean }
        icd: { type: boolean, description: The node has ICD Management. }
        addresses: { type: array, items: { type: string } }
        commissioned_at: { type: string, format: date-time }
    ControllerNodeList:
      type: object
      required: [nodes]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/ControllerNodeSummary" }
    NodeRecord:
      type: object
      required: [fabric_index, addresses]
      properties:
        fabric_index: { type: integer, description: Our fabric index. }
        fabric_index_on_peer: { type: integer, description: The index the node gave our fabric; absent when unknown. }
        addresses: { type: array, items: { type: string } }
        hostname: { type: string }
        discovered_at: { type: string, format: date-time }
        commissioned_at: { type: string, format: date-time }
        discriminator: { type: integer }
        announced_vendor_id: { type: integer }
        announced_product_id: { type: integer }
        announced_device_type: { type: integer }
        device_name: { type: string }
    NodeProperties:
      type: object
      required: [supports_thread, supports_wifi, supports_ethernet, mains_powered, battery_powered, intermittently_connected, device_types]
      properties:
        supports_thread: { type: boolean }
        supports_wifi: { type: boolean }
        supports_ethernet: { type: boolean }
        mains_powered: { type: boolean }
        battery_powered: { type: boolean }
        intermittently_connected: { type: boolean }
        long_idle_time_operating: { type: boolean }
        thread_sleepy_end_device: { type: boolean }
        idle_mode_duration_seconds: { type: integer }
        specification_version: { type: integer }
        serial_number: { type: string }
        software_version: { type: string }
        device_types: { type: array, items: { type: integer } }
    NodeDeviceType:
      type: object
      required: [id, id_hex, name]
      properties:
        id: { type: integer }
        id_hex: { type: string }
        name: { type: string, description: The device type's name; empty for one the schema does not know. }
        revision: { type: integer }
    NodeCluster:
      type: object
      required: [id, id_hex, name, revision, features]
      properties:
        id: { type: integer }
        id_hex: { type: string }
        name: { type: string, description: The cluster's name; empty for one the schema does not know. }
        revision: { type: integer }
        features: { type: array, items: { type: string } }
    NodeEndpoint:
      type: object
      required: [endpoint, device_types, clusters]
      properties:
        endpoint: { type: integer }
        parent: { type: integer, description: The endpoint whose parts list names this one; absent for the root and top-level endpoints. }
        name: { type: string }
        reachable: { type: boolean, description: "BridgedDeviceBasicInformation Reachable, where the endpoint serves it (0.4.0)." }
        device_types:
          type: array
          items: { $ref: "#/components/schemas/NodeDeviceType" }
        clusters:
          type: array
          items: { $ref: "#/components/schemas/NodeCluster" }
    EndpointDetail:
      type: object
      description: |
        One endpoint with its inventory (contract 0.4.0), one shape for both
        families. The controller family fills it from its image of the node:
        `conformance`, never `scope` or `decisions`; its `clusters` carry no
        attribute values. The node family (0.4.1) fills it from what the node
        serves: `scope` for a bridged endpoint, `decisions`, never
        `conformance`; its `clusters` carry the values.
      required: [endpoint_id, name, reachable, device_types, tags, labels, parts, clusters]
      properties:
        endpoint_id: { type: integer }
        parent_endpoint_id: { type: integer, description: The endpoint whose parts list names this one; absent for the root and top-level endpoints. }
        name: { type: string, description: "The device type's name as the controller names the endpoint." }
        reachable: { type: boolean, description: BridgedDeviceBasicInformation Reachable where the endpoint serves it; true elsewhere. }
        device_types:
          type: array
          description: The Descriptor's DeviceTypeList in its order.
          items: { $ref: "#/components/schemas/EndpointDeviceType" }
        scope: { type: string, description: The snapshot scope a node-side endpoint was assembled from; absent on the controller side. }
        tags:
          type: array
          description: The Descriptor's TagList; empty when the endpoint serves none.
          items: { $ref: "#/components/schemas/SemanticTag" }
        labels:
          type: array
          description: The FixedLabel LabelList, then the UserLabel LabelList.
          items: { $ref: "#/components/schemas/EndpointLabel" }
        parts:
          type: array
          description: The endpoint numbers of its direct children — the endpoints whose parent it is, not every descendant its PartsList names.
          items: { type: integer }
        clusters:
          type: array
          description: The server clusters in id order.
          items: { $ref: "#/components/schemas/ClusterDetail" }
        conformance: { $ref: "#/components/schemas/ConformanceVerdict" }
        decisions:
          type: array
          description: The node's surface decisions on this endpoint (0.4.1, node family only), as `GET /node/surface` lists them.
          items: { $ref: "#/components/schemas/SurfaceDecision" }
    EndpointDeviceType:
      type: object
      required: [id, id_hex, revision]
      properties:
        id: { type: integer }
        id_hex: { type: string }
        name: { type: string, description: The device type's name; absent for one the schema does not know. }
        revision: { type: integer }
    SemanticTag:
      type: object
      required: [namespace, tag]
      properties:
        namespace: { type: integer }
        tag: { type: integer }
        mfg_code: { type: integer, description: The manufacturer code of a manufacturer-specific namespace; absent when null. }
        label: { type: string }
    EndpointLabel:
      type: object
      required: [label, value, user]
      properties:
        label: { type: string }
        value: { type: string }
        user: { type: boolean, description: An entry of UserLabel; FixedLabel's otherwise. }
    ConformanceVerdict:
      type: object
      description: The device type conformance of the endpoint as the controller judges its image.
      required: [status, violations, unjudged]
      properties:
        status: { type: string, enum: [unknown, incomplete, clean, violated] }
        violations:
          type: array
          items: { $ref: "#/components/schemas/ConformanceViolation" }
        unjudged:
          type: array
          description: The server clusters the ServerList names whose inside was not judged.
          items: { $ref: "#/components/schemas/ClusterElement" }
    ConformanceViolation:
      type: object
      required: [device_type, requirement, kind, detail]
      properties:
        device_type: { type: string }
        device_type_id: { type: integer, description: Absent for Base and where the violation names no device type. }
        requirement: { type: string }
        kind: { type: string }
        detail: { type: string }
    ClusterDetail:
      type: object
      description: One server cluster with its inventory (contract 0.4.0).
      required: [id, id_hex, revision, feature_map_hex, features, attributes, accepted, generated, events]
      properties:
        id: { type: integer }
        id_hex: { type: string }
        name: { type: string, description: The cluster's name; absent for one no definition names. }
        revision: { type: integer }
        feature_map_hex: { type: string }
        features:
          type: array
          description: The features the feature map sets, in bit order.
          items: { $ref: "#/components/schemas/ClusterFeature" }
        data_version: { type: integer, description: The cluster's DataVersion; absent while unknown. }
        attributes:
          type: array
          description: The AttributeList in id order.
          items: { $ref: "#/components/schemas/ClusterAttribute" }
        accepted:
          type: array
          description: The AcceptedCommandList.
          items: { $ref: "#/components/schemas/ClusterElement" }
        generated:
          type: array
          description: The GeneratedCommandList.
          items: { $ref: "#/components/schemas/ClusterElement" }
        events:
          type: array
          description: The EventList where the peer reports one.
          items: { $ref: "#/components/schemas/ClusterElement" }
    ClusterFeature:
      type: object
      required: [code, bit]
      properties:
        code: { type: string, description: 'The short name ("LT").' }
        title: { type: string, description: 'The long name ("Lighting"); absent where no definition names it.' }
        bit: { type: integer }
    ClusterAttribute:
      type: object
      required: [id, id_hex]
      properties:
        id: { type: integer }
        id_hex: { type: string }
        name: { type: string }
        value: { description: The attribute's value as JSON by field name; absent in a structure-only answer or while unknown., x-go-type: json.RawMessage }
        status: { type: integer, description: "The IM status the attribute was answered with; absent on success. The node family sets it, without a `value`, for an attribute its read path failed (0.5.0)." }
    ClusterElement:
      type: object
      required: [id, id_hex]
      properties:
        id: { type: integer }
        id_hex: { type: string }
        name: { type: string }
    EventRecord:
      type: object
      description: One Matter event (0.4.1), one shape for both families — an event the node served, or one the controller received from a node.
      required: [number, priority, endpoint, cluster_hex, event_hex]
      properties:
        number: { type: integer, description: The node-wide event number (Matter Core §7.14.2.1). }
        priority: { type: string, enum: [debug, info, critical] }
        endpoint: { type: integer }
        cluster_hex: { type: string }
        event_hex: { type: string }
        name: { type: string, description: The event's name in go-fabric's schema; absent for one it does not name. }
        epoch_ms: { type: integer, description: The event's epoch timestamp in milliseconds; absent when the event carries a system timestamp only. }
        data: { description: The event's data as JSON by field name; absent without data or when it cannot be rendered., x-go-type: json.RawMessage }
    EventRecordList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          description: Oldest first.
          items: { $ref: "#/components/schemas/EventRecord" }
    ControllerNodeDetail:
      type: object
      required: [node, record, properties, endpoints]
      properties:
        node: { $ref: "#/components/schemas/ControllerNodeSummary" }
        record: { $ref: "#/components/schemas/NodeRecord" }
        properties: { $ref: "#/components/schemas/NodeProperties" }
        endpoints:
          type: array
          items: { $ref: "#/components/schemas/NodeEndpoint" }
    AutoSubscribeRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    NodeWindowRequest:
      type: object
      properties:
        timeout_seconds: { type: integer, minimum: 0, maximum: 65535, description: "How long the window stays open; 0 or absent is the node's default (900 s)." }
    NodeWindow:
      type: object
      required: [manual_code, qr_code, passcode, discriminator, vendor_id, product_id, timeout_seconds]
      properties:
        manual_code: { type: string }
        qr_code: { type: string }
        passcode: { type: integer }
        discriminator: { type: integer }
        vendor_id: { type: integer }
        product_id: { type: integer }
        timeout_seconds: { type: integer }
    AttributePath:
      type: object
      required: [endpoint, cluster_hex, attribute_hex]
      properties:
        endpoint: { type: integer, minimum: 0, maximum: 65535 }
        cluster_hex: { type: string, description: "The cluster id in hex, `0x` optional (\"0x0006\")." }
        attribute_hex: { type: string, description: "The attribute id in hex, `0x` optional." }
    ReadRequest:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          items: { $ref: "#/components/schemas/AttributePath" }
        fabric_filtered: { type: boolean, description: Read fabric-scoped lists filtered to our fabric; absent is true. }
    AttributeValue:
      type: object
      required: [endpoint, cluster_hex, attribute_hex]
      properties:
        endpoint: { type: integer }
        cluster_hex: { type: string }
        attribute_hex: { type: string }
        value: { description: The attribute's value as JSON; absent when the node answered a status., x-go-type: json.RawMessage }
        status: { type: integer, description: The node's status for the path; absent on success. }
    AttributeValueList:
      type: object
      required: [values]
      properties:
        values:
          type: array
          items: { $ref: "#/components/schemas/AttributeValue" }
    WriteRequest:
      type: object
      required: [endpoint, cluster_hex, attribute_hex, value]
      properties:
        endpoint: { type: integer, minimum: 0, maximum: 65535 }
        cluster_hex: { type: string }
        attribute_hex: { type: string }
        value: { description: The value as JSON, in the shape a read answers., x-go-type: json.RawMessage }
        timed_ms: { type: integer, minimum: 0, maximum: 65535, description: A timed write with this timeout; absent writes untimed unless the attribute needs it. }
    WriteResult:
      type: object
      required: [status]
      properties:
        status: { type: integer, description: The node's status; 0 is success. }
        cluster_status: { type: integer }
    InvokeRequest:
      type: object
      required: [endpoint, cluster_hex, command_hex]
      properties:
        endpoint: { type: integer, minimum: 0, maximum: 65535 }
        cluster_hex: { type: string }
        command_hex: { type: string }
        payload: { description: The command's fields by name; absent or null is the empty payload., x-go-type: json.RawMessage }
        timed_ms: { type: integer, minimum: 0, maximum: 65535 }
    InvokeResult:
      type: object
      required: [status]
      properties:
        status: { type: integer, description: The node's status; 0 is success. }
        cluster_status: { type: integer }
        response_command_hex: { type: string, description: The response command's id; absent without a response command. }
        response: { description: The response command's fields by name; absent without one., x-go-type: json.RawMessage }
    AclTarget:
      type: object
      properties:
        cluster_hex: { type: string, description: Absent is any cluster. }
        endpoint: { type: integer, description: Absent is any endpoint. }
        device_type_hex: { type: string, description: Absent is any device type. }
    AclEntry:
      type: object
      required: [privilege, auth_mode, subjects_hex, targets]
      properties:
        privilege: { type: string, enum: [view, proxy_view, operate, manage, administer] }
        auth_mode: { type: string, enum: [pase, case, group] }
        subjects_hex:
          type: array
          description: Node ids (CASE), group ids (Group) or CATs in hex; empty is every subject of the auth mode.
          items: { type: string }
        targets:
          type: array
          description: Empty is the whole node.
          items: { $ref: "#/components/schemas/AclTarget" }
        fabric_index: { type: integer, description: Set by the node; ignored in a write. }
    AclEntryList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AclEntry" }
    BindingTarget:
      type: object
      properties:
        node_id_hex: { type: string, description: A unicast target's node; with `endpoint`. }
        group: { type: integer, description: A groupcast target's group id. }
        endpoint: { type: integer }
        cluster_hex: { type: string, description: Absent is every client cluster of the endpoint. }
        fabric_index: { type: integer, description: Set by the node; ignored in a write. }
    EndpointBindings:
      type: object
      required: [endpoint, bindings]
      properties:
        endpoint: { type: integer, minimum: 0, maximum: 65535 }
        bindings:
          type: array
          items: { $ref: "#/components/schemas/BindingTarget" }
    BindingList:
      type: object
      required: [endpoints]
      properties:
        endpoints:
          type: array
          items: { $ref: "#/components/schemas/EndpointBindings" }
    IcdState:
      type: object
      required: [supported, lit_supported, registered]
      properties:
        supported: { type: boolean }
        lit_supported: { type: boolean }
        registered: { type: boolean }
        operating_mode: { type: string, enum: [sit, lit] }
        awake: { type: boolean }
        available: { type: boolean }
        next_check_in: { type: string, format: date-time }
        last_check_in: { type: string, format: date-time }
    IcdRegisterRequest:
      type: object
      properties:
        allow_multi_admin: { type: boolean, description: Register although other administrators' vendors may not support LIT. }
    IcdUnregisterRequest:
      type: object
      properties:
        force: { type: boolean, description: Forget the registration without asking the node. }
    NodeFabric:
      type: object
      required: [fabric_index, fabric_id_hex, node_id_hex, vendor_id, vendor_name, label, own]
      properties:
        fabric_index: { type: integer }
        fabric_id_hex: { type: string }
        node_id_hex: { type: string }
        vendor_id: { type: integer }
        vendor_name: { type: string }
        label: { type: string }
        own: { type: boolean, description: This controller's fabric. }
    NodeFabricList:
      type: object
      required: [fabrics]
      properties:
        fabrics:
          type: array
          items: { $ref: "#/components/schemas/NodeFabric" }
    DiscoveredRef:
      type: object
      required: [instance_name]
      properties:
        instance_name: { type: string }
        long_discriminator: { type: integer, description: Searched for again when the controller no longer holds the discovery. }
    CommissionRequest:
      type: object
      description: Either `code`, or `discovered` with `passcode`.
      properties:
        code: { type: string, description: A QR payload ("MT:…") or a manual pairing code. }
        discovered: { $ref: "#/components/schemas/DiscoveredRef" }
        passcode: { type: integer, minimum: 1, maximum: 99999998 }
        wifi_id: { type: string, description: The stored Wi-Fi credential to put the device on. }
        thread_id: { type: string, description: The stored Thread dataset to put the device on. }
        network_only: { type: boolean, description: "Never commission over Bluetooth LE, and the `commissioning_progress` event's `ble` reason is `network_only` (0.7.1)." }
        timeout_seconds: { type: integer, minimum: 1, maximum: 600, description: The whole commissioning's bound; absent is the controller's default. }
        terms_and_conditions: { $ref: "#/components/schemas/TermsAcknowledgement" }
    TermsAcknowledgement:
      type: object
      description: "The Terms and Conditions acknowledgement the commissioning sends with GeneralCommissioning's SetTCAcknowledgements (0.7.0; go-fabric commissioner.Options.TermsAndConditions, chip-tool's --tc-acknowledgements-version and --tc-acknowledgements). A device that requires terms fails the commissioning without one, or with one below its version, with 409 terms_required (0.8.0; before 0.8.0 a 502 at CommissioningComplete); absent sends none."
      required: [version, acknowledgements]
      properties:
        version: { type: integer, minimum: 0, maximum: 65535, description: The version of the terms the user accepted. }
        acknowledgements: { type: integer, minimum: 0, maximum: 65535, description: The bitmap of the terms the user accepted. }
    Discovered:
      type: object
      required: [instance_name, long_discriminator, addresses, commissioning_mode]
      properties:
        instance_name: { type: string }
        hostname: { type: string }
        addresses: { type: array, items: { type: string } }
        port: { type: integer }
        long_discriminator: { type: integer }
        vendor_id: { type: integer }
        vendor_name: { type: string }
        product_id: { type: integer }
        device_type: { type: integer }
        device_name: { type: string }
        commissioning_mode: { type: integer }
        pairing_hint: { type: integer }
        pairing_instruction: { type: string }
    DiscoveredList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items: { $ref: "#/components/schemas/Discovered" }
    Credential:
      type: object
      required: [kind, id, name]
      properties:
        kind: { type: string, enum: [wifi, thread] }
        id: { type: string }
        name: { type: string, description: The SSID of a Wi-Fi credential, the network name of a Thread dataset. }
        default: { type: boolean, description: "The host's default entry (0.7.1): the one a commissioning started without a choice would use on the host's own interfaces; the pages preselect it. Absent is false." }
    CredentialList:
      type: object
      required: [credentials]
      properties:
        credentials:
          type: array
          items: { $ref: "#/components/schemas/Credential" }
    CredentialRequest:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [wifi, thread] }
        id: { type: string, minLength: 1, maxLength: 64 }
        ssid: { type: string, description: Wi-Fi; required for it. }
        passphrase: { type: string, description: Wi-Fi; write-only. }
        dataset_hex: { type: string, description: Thread; the operational dataset as hex MeshCoP TLVs, write-only. }
    FabricLabelRequest:
      type: object
      required: [label]
      properties:
        label: { type: string, maxLength: 32 }
    PendingUpdate:
      type: object
      required: [node_id_hex, vendor_id, product_id, target_software_version, status]
      properties:
        node_id_hex: { type: string }
        vendor_id: { type: integer }
        product_id: { type: integer }
        target_software_version: { type: integer }
        status: { type: string, enum: [queued, in_progress, stalled] }
        progress_status: { type: string, description: The last status the node reported; absent before one. }
        progress_at: { type: string, format: date-time }
        transferred: { type: integer }
        length: { type: integer }
    UpdateQueue:
      type: object
      required: [available, queue]
      properties:
        available: { type: boolean }
        queue:
          type: array
          items: { $ref: "#/components/schemas/PendingUpdate" }
    UpdateConsentRequest:
      type: object
      required: [node_id_hex, vendor_id, product_id, target_software_version]
      properties:
        node_id_hex: { type: string }
        vendor_id: { type: integer }
        product_id: { type: integer }
        target_software_version: { type: integer }
    AvailableUpdate:
      type: object
      required: [node_id_hex, vendor_id, product_id, software_version, software_version_string]
      properties:
        node_id_hex: { type: string }
        vendor_id: { type: integer }
        product_id: { type: integer }
        software_version: { type: integer }
        software_version_string: { type: string }
    AvailableUpdateList:
      type: object
      required: [updates]
      properties:
        updates:
          type: array
          items: { $ref: "#/components/schemas/AvailableUpdate" }
    ControllerEvent:
      type: object
      description: The payload of every controller stream event.
      properties:
        node_id_hex: { type: string, description: The node the event is about; absent for a controller-wide one. }
        connection: { $ref: "#/components/schemas/ConnectionState" }
        active: { type: boolean, description: "subscription: whether the default subscription is up." }
        phase: { type: string, enum: [started, succeeded, failed], description: "commissioning_progress: the commissioning's phase." }
        detail: { type: string, description: "commissioning_progress failed: the failure's kind, never its text — invalid_argument, no_device, timeout, node_failed, failed, and terms_required (0.8.0) for a device that requires an accepted version of its terms and conditions." }
        step: { $ref: "#/components/schemas/PairingStep" }
        ble: { $ref: "#/components/schemas/BLEDecision" }
        update_kind:
          type: string
          enum: [available, consent_changed, check_finished, applying, done, failed, queued, transfer_started]
          description: "update (0.7.0): what the controller's update manager reported (go-fabric softwareupdate.UpdateEventKind)."
        update_version: { type: integer, description: "update: the target software version, for the kinds that carry one." }
        update_error: { type: string, description: "update: the error of check_finished and failed (no secret)." }
    BLEDecision:
      type: object
      description: "commissioning_progress (0.7.1): whether a commissioning from a code searches over Bluetooth LE and, if not, why — once, before the first step, while the event's phase stays started. no_central: the host has no central; network_only: the request ruled BLE out; code_without_ble: the QR code's discovery capabilities do not name BLE; no_network: the request names no credential, and a device on BLE has no network yet. A commissioning of a discovered device carries none."
      required: [used]
      properties:
        used: { type: boolean }
        reason: { type: string, enum: [no_central, network_only, code_without_ble, no_network], description: Present when used is false. }
    PairingStep:
      type: object
      description: "commissioning_progress (0.7.0): one step of the commissioning as it starts and ends, while the event's phase stays started. Names are matter.js's commissioning steps verbatim, plus go-fabric's Discovery 2.1, PASE 2.2 and Subscribe 21.1 (go-fabric controller.PairingStep)."
      required: [number, sub, name, phase]
      properties:
        number: { type: integer }
        sub: { type: integer }
        name: { type: string }
        phase: { type: string, enum: [started, succeeded, failed, skipped] }
