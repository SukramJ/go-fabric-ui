openapi: 3.1.0
info:
  title: go-fabric-ui
  version: 0.8.0
  summary: The HTTP API behind the go-fabric web interface.
  description: |
    Routes of the node page family and of the controller page family. Every path is relative to the mount prefix
    (default `/api/v1`). Errors are RFC 9457 problem+json (`Problem`).

    Versioning: a minor version adds paths, methods, response fields and
    optional request fields; it never removes or renames one, and never
    makes an optional request field required. `contract/previous/` holds
    the last released copy, and a test fails on a removal.

    64-bit identifiers travel exactly as 16-digit uppercase hex strings
    (`*_hex`); their numeric twins are informational, since a JSON number
    carries 53 bits and a browser rounds larger ids.

    Admin routes (`x-admin: true`) answer 403 unless the host's admin
    check admits the request, or, in token mode, the request carries the
    `X-Fabric-UI-Token` header with the `csrf_token` of `GET /node/status`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
tags:
  - name: node
    description: The node page family — the device side of a go-fabric node.
  - name: controller
    description: |
      The controller page family — the commissioner side of a go-fabric
      controller. Present only when the host serves it; otherwise every
      `/controller/*` path answers 404.
  - name: operation
    description: |
      The daemon's operation, beside both page families: its log level,
      its log ring and stream, its version and uptime. Present when the
      host attaches an operations port; otherwise every `/operation/*`
      path answers 503.
paths:
  /node/status:
    get:
      tags: [node]
      operationId: getNodeStatus
      summary: Health, counts and the commissioning window.
      responses:
        "200":
          description: The status; `enabled` is false when the host serves no node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /node/fabrics:
    get:
      tags: [node]
      operationId: listFabrics
      summary: The commissioned fabrics.
      responses:
        "200":
          description: The fabrics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FabricList" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/fabrics/{index}:
    delete:
      tags: [node]
      operationId: removeFabric
      summary: Remove one fabric.
      x-admin: true
      parameters:
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 254 }
      responses:
        "204": { description: Removed. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/pairing:
    get:
      tags: [node]
      operationId: getPairing
      summary: The pairing codes — of the window this handler opened while it is open, else the configured ones.
      x-admin: true
      responses:
        "200":
          description: The codes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pairing" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/pairing/window:
    post:
      tags: [node]
      operationId: openWindow
      summary: Open a commissioning window.
      x-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WindowRequest" }
      responses:
        "200":
          description: The window is open; the codes commission through it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Window" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/pairing/window/close:
    post:
      tags: [node]
      operationId: closeWindow
      summary: Close the open commissioning window.
      x-admin: true
      responses:
        "204": { description: Closed. }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/endpoints:
    get:
      tags: [node]
      operationId: listEndpoints
      summary: The bridged endpoints a controller sees.
      description: |
        `endpoints` are the bridged endpoints of the node's topology
        (go-fabric `Node.Topology`), each device followed by its parts.
        `structural` (0.5.0) are the endpoints no bridged device declares —
        the root and the Aggregator — from the node's endpoint tree
        (go-fabric `Node.Endpoints`), root first, then by number.
      responses:
        "200":
          description: The endpoints.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EndpointList" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/endpoints/{ep}:
    parameters:
      - $ref: "#/components/parameters/EndpointNumber"
    get:
      tags: [node]
      operationId: getEndpointDetail
      summary: One endpoint the node serves, with its attribute values (0.4.1).
      description: |
        Read through the node's own read path (go-fabric `Node.ReadCluster`),
        as a controller's read reaches it, without access control: the
        Descriptor's DeviceTypeList, TagList and PartsList, the FixedLabel
        and UserLabel entries, and every server cluster of its ServerList
        with its revision, feature map, attribute values (JSON by field
        name), data version and the names go-fabric's schema gives its
        attributes, commands and events. An attribute whose read failed
        carries the IM `status` it was answered with and no `value` (0.5.0,
        go-fabric `AttributeValue.Status`). The endpoint's parent, parts,
        device types, name and scope come from the node's endpoint tree
        (go-fabric `Node.Endpoints`, 0.5.0). `decisions` are the surface
        report's decisions on this endpoint. The root endpoint and the
        Aggregator answer too. 404 for an endpoint the node does not serve,
        503 before the node started.
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EndpointDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/endpoints/{ep}/events:
    parameters:
      - $ref: "#/components/parameters/EndpointNumber"
    get:
      tags: [node]
      operationId: listEndpointEvents
      summary: The events the node's event log holds for one endpoint (0.4.1).
      description: |
        The records a controller's event read is answered from (go-fabric
        `Node.Events` with the endpoint's filter), oldest first: the log is
        bounded and volatile, emptied when the node stops. An endpoint no
        longer served keeps the events it emitted while the log holds them,
        so an unknown endpoint is an empty list, not 404. Not the
        diagnostic trace of `GET /node/events`.
      parameters:
        - $ref: "#/components/parameters/EventSince"
        - $ref: "#/components/parameters/EventLimit"
      responses:
        "200":
          description: The events, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRecordList" }
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/surface:
    get:
      tags: [node]
      operationId: getNodeSurface
      summary: The node's surface report.
      description: |
        go-fabric's `surface.Report` of the node in go-fabric's own JSON
        encoding (`surface.Report.MarshalJSON`): the effective surface per
        endpoint, the decision ledger, the withheld elements and the
        surface changes announced in this process. Element and cluster ids
        are lowercase `0x` hex strings, as wide as their kind (a device
        type four digits, everything else eight).
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SurfaceReport" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/sessions:
    get:
      tags: [node]
      operationId: listSessions
      summary: The open secure sessions and the session-id occupancy.
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/topology:
    get:
      tags: [node]
      operationId: getNodeTopology
      summary: The node as a graph — its bridge, its fabrics and the sessions on them.
      description: |
        Built from go-fabric's `Topology`, `FabricInfos` and
        `SessionDiagnostics`: the node, its Aggregator, the bridged devices
        and their parts (`contains`), each fabric with the sessions on it
        (`contains`) and every session to the node (`session`). A PASE
        session (fabric index 0) hangs on the node without a fabric. Node
        ids are `node`, `ep:<n>`, `fabric:<index>`, `session:<id>`.
        Subscriptions are counts per session. 503 while the host serves no
        node or the node has not assembled its endpoints.
      responses:
        "200":
          description: The graph.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopologyGraph" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/mdns:
    get:
      tags: [node]
      operationId: getMdns
      summary: The live DNS-SD advertisement and its diagnosis.
      responses:
        "200":
          description: The advertisement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mdns" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/mdns/reannounce:
    post:
      tags: [node]
      operationId: reannounce
      summary: Announce the node's DNS-SD records now.
      description: |
        Publishes every advertised service once per interface, with the
        goodbyes of the addresses that left (go-fabric
        `Node.TriggerReannounce`, 0.7.0) — for an operator who changed the
        network and does not want to wait for the advertiser's schedule. A
        no-op on an advertiser that cannot reannounce; 204 either way.
      x-admin: true
      responses:
        "204": { description: Announced. }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/compatibility:
    get:
      tags: [node]
      operationId: getCompatibility
      summary: The commissioned ecosystems and known incompatibilities.
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Compatibility" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/events:
    get:
      tags: [node]
      operationId: listDiagnosticEvents
      summary: The pairing, session and discovery trace, newest first.
      responses:
        "200":
          description: The trace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiagnosticEventList" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/exposure/schema:
    get:
      tags: [node]
      operationId: getExposureSchema
      summary: How the selection page shows the host's items.
      responses:
        "200":
          description: The schema.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExposureSchema" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/exposure:
    get:
      tags: [node]
      operationId: listExposure
      summary: Every item the host could expose.
      responses:
        "200":
          description: The items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemList" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    put:
      tags: [node]
      operationId: applyExposure
      summary: Apply a batch of item changes and reassemble the endpoints.
      x-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateList" }
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Applied" }
        "204": { description: The batch was empty. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/exposure/preview:
    post:
      tags: [node]
      operationId: previewExposure
      summary: The items as a batch of changes would leave them; nothing is written.
      x-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateList" }
      responses:
        "200":
          description: The touched items after the changes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemList" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/maintenance/reassemble:
    post:
      tags: [node]
      operationId: reassemble
      summary: Rebuild the endpoints from the host's current selection; pairings are untouched.
      x-admin: true
      responses:
        "204": { description: Reassembled. }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/maintenance/factory-reset:
    post:
      tags: [node]
      operationId: factoryReset
      summary: Remove every fabric. The body must name the action.
      x-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactoryResetRequest" }
      responses:
        "204": { description: Every fabric is removed. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/maintenance/erase:
    post:
      tags: [node]
      operationId: erase
      summary: Erase the node — its store and endpoint records — and end it. The body must name the action.
      description: |
        The host's erase (0.7.0, `Options.Erase`): go-fabric
        `Node.FactoryReset` removes every fabric, stops the node and erases
        what it persisted; the node is single-use, so the host builds a new
        one on the erased store or restarts. `Status.erase` says whether the
        host wires it. Unlike `POST /node/maintenance/factory-reset`, which
        removes the fabrics and keeps the node running, this ends the node:
        until the host brings one back, the node routes may answer with the
        old node's state or fail. 501 `not_implemented` when the host wires
        no erase.
      x-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EraseRequest" }
      responses:
        "204": { description: Erased; the host brings the node back or restarts. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /node/stream:
    get:
      tags: [node]
      operationId: stream
      summary: Server-sent events.
      description: |
        `event:` is one of fabric_added, fabric_removed, fabric_updated,
        commissioning_complete, window_opened, window_closed,
        endpoints_changed, exposure_changed, surface_changed,
        session_opened, session_closed, subscriptions_changed,
        attribute_changed, cluster_event, health_sample, diagnostic_event,
        nodes_changed; `data:` is the JSON payload (`FabricEvent`,
        `WindowEvent`, `{}`, `ExposureEvent`, `SurfaceChangedEvent`,
        `SessionEvent`, `AttributeChangedEvent`, `EventRecord`,
        `HealthSampleEvent`, `DiagnosticEvent`, `NodesChangedEvent`).
        fabric_added (an AddNOC installed the fabric), fabric_updated (an
        UpdateNOC, UpdateFabricLabel or SetVIDVerificationStatement changed
        it; `FabricEvent` as fabric_added) and commissioning_complete (a
        CommissioningComplete succeeded; `FabricEvent` with `fabric_index`
        alone) are go-fabric's node.Observers OnFabricAdded,
        OnFabricUpdated and OnCommissioningComplete (0.7.0): a
        commissioning reports fabric_added, then commissioning_complete.
        cluster_event (0.7.0) is every event a cluster server emitted and
        the node's event log recorded (node.Observers.OnEvent), in the
        shape of `GET /node/endpoints/{ep}/events`.
        nodes_changed (0.6.0) follows `POST /nodes`, `PUT
        /nodes/{node}/label` and `DELETE /nodes/{node}` on every node's
        stream, with the keys of the nodes created, renamed or deleted: a
        page reloads `GET /nodes`.
        attribute_changed (0.4.1) names the attributes that changed, never
        their values: a page refetches what it shows.
        health_sample (0.5.0) is every verdict of the node's health probe
        (go-fabric `Node.OnHealthSample`); diagnostic_event (0.5.0) is every
        entry the node adds to the trace `GET /node/events` serves (go-fabric
        `Node.OnDiagnosticEvent`), in the same shape.
        session_opened reports CASE sessions only (go-fabric
        node.Observers.OnSessionOpened); a PASE session is not reported, and
        session_closed and subscriptions_changed follow only a session
        session_opened reported.
        A comment line arrives every 15 s. No payload carries a passcode.
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string }
  /nodes:
    get:
      tags: [node]
      operationId: listNodes
      summary: The device nodes the host serves, the default node first (0.5.0).
      description: |
        Every node of the node family, in the host's order; the first is the
        default node, the one the `/node/*` routes serve. Each is reached under
        `/nodes/{node}/…` by its key as well, with the operations of `/node/*`.
        Empty when the host serves no node. A page shows a node selector when
        the list holds more than one. With a node registry (0.6.0) the
        registry's nodes follow the default, read on every request, each
        `managed`.
      responses:
        "200":
          description: The nodes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeSummaryList" }
    post:
      tags: [node]
      operationId: createNode
      summary: Create a node in the host's node registry (0.6.0).
      description: |
        The host allocates the key (a slug of the label), the port, the
        discriminator, the passcode and the store, and starts the node; its
        routes answer under `/nodes/{node}/…` at once. 409 `node_limit` when
        the host serves no further node; 503 without a registry
        (`Status.node_registry` absent). Every node's stream carries
        `nodes_changed`.
      x-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeLabelRequest" }
      responses:
        "201":
          description: The node, as `GET /nodes` lists it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeSummary" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /nodes/{node}:
    parameters:
      - $ref: "#/components/parameters/NodeKey"
    delete:
      tags: [node]
      operationId: deleteNode
      summary: Delete a node of the host's node registry (0.6.0).
      description: |
        Final: the host stops the node and removes its fabrics (its
        controllers lose the node), its store and its selection. 409
        `node_is_default` for the default node, which is the host's
        configuration; 404 for a key `GET /nodes` does not list; 503
        without a registry. Every node's stream carries `nodes_changed`.
      x-admin: true
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /nodes/{node}/label:
    parameters:
      - $ref: "#/components/parameters/NodeKey"
    put:
      tags: [node]
      operationId: renameNode
      summary: Rename a node of the host's node registry (0.6.0).
      description: |
        409 `node_is_default` for the default node, which is the host's
        configuration; 404 for a key `GET /nodes` does not list; 503
        without a registry. Every node's stream carries `nodes_changed`.
      x-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeLabelRequest" }
      responses:
        "204": { description: Renamed. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /nodes/{node}/status:
    parameters:
      - $ref: "#/components/parameters/NodeKey"
    get:
      tags: [node]
      operationId: getNodeStatusForNode
      summary: Health, counts and the commissioning window.
      description: "As `GET /node/status` (`getNodeStatus`), for the node `{node}`; 404 for a key `GET /nodes` does not list (0.5.0)."
      responses:
        "200":
          description: The status; `enabled` is false when the host serves no node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "404": { $ref: "#/components/responses/Problem" }
  /nodes/{node}/fabrics:
    parameters:
      - $ref: "#/components/parameters/NodeKey"
    get:
      tags: [node]
      operationId: listFabricsForNode
      summary: The commissioned fabrics.
      description: "As `GET /node/fabrics` (`listFabrics`), for the node `{node}`; 404 for a key `GET /nodes` does not list (0.5.0)."
      responses:
        "200":
          description: The fabrics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FabricList" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /nodes/{node}/fabrics/{index}:
    parameters:
      - $ref: "#/components/parameters/NodeKey"
    delete:
      tags: [node]
      operationId: removeFabricForNode
      summary: Remove one fabric.
      description: "As `DELETE /node/fabrics/{index}` (`removeFabric`), for the node `{node}`; 404 for a key `GET /nodes` does not list (0.5.0)."
      x-admin: true
      parameters:
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 254 }
      responses:
        "204": { description: Removed. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /nodes/{node}/pairing:
    parameters:
      - $ref: "#/components/parameters/NodeKey"
    get:
      tags: [node]
      operationId: getPairingForNode
      summary: The pairing codes — of the window this handler opened while it is open, else the configured ones.
      description: "As `GET /node/pairing` (`getPairing`), for the node `{node}`; 404 for a key `GET /nodes` does not list (0.5.0)."
      x-admin: true
      responses:
        "200":
          description: The codes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pairing" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /nodes/{node}/pairing/window:
    parameters:
      - $ref: "#/components/parameters/NodeKey"
    post:
      tags: [node]
      operationId: openWindowForNode
      summary: Open a commissioning window.
      description: "As `POST /node/pairing/window` (`openWindow`), for the node `{node}`; 404 for a key `GET /nodes` does not list (0.5.0)."
