# Nightly: the macOS test leg, the form of go-fabric's nightly.yml. Linux
# and Windows carry the race detector on every pull request (ci.yml).
# macOS is the second platform the module is developed and consumed on,
# and the one whose networking differs where fabrictest's end-to-end tests
# touch it — IPv6 UDP on loopback, multicast joins, interface enumeration
# for DNS-SD. It runs nightly rather than per pull request because the
# signal is a platform regression, which arrives on the calendar (a runner
# image bump) at least as often as in a diff — and because GitHub's hosted
# macOS arm64 pool is capacity-constrained: a queued job that no runner
# acquires is cancelled after 15 minutes, and as a required check it
# blocked every pull request (issue #40). A red night is a signal, not a
# gate; it is read by hand.
#
# Beside it: the full npm audit (development packages included), which
# reports in the job summary and never fails (decision 54; a runtime
# advisory fails the web job of ci.yml), and make fuzz at three minutes
# per target (decision 53), which uploads a failing input as an artifact.
name: nightly

on:
  schedule:
    - cron: "17 2 * * *" # daily 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.4"
  NODE_VERSION: "22.22.1"

jobs:
  test-macos:
    name: test (macos-latest, race)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout=600s ./...

  fuzz:
    name: fuzz (make fuzz, 3m per target)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: make fuzz
        run: make fuzz FUZZTIME=3m
      - name: failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  npm-audit:
    name: npm audit (whole tree, report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit
        run: |
          cd ui
          {
            echo "### npm audit (whole tree)"
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
