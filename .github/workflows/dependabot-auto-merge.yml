name: Dependabot auto-merge

# yamllint disable-line rule:truthy
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # go-fabric is 0.x, where a minor bump is breaking, and each of its
      # versions is a wave of this repository (CLAUDE.md "State"): its bumps
      # are merged by hand, never automatically.
      - name: Enable auto-merge for non-major updates (go-fabric excluded)
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major' &&
          !contains(steps.meta.outputs.dependency-names, 'github.com/SukramJ/go-fabric')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
