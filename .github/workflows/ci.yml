# GitHub Actions CI for go-fabric-ui, the form of the sibling repositories
# (go-ha2fabric, go-fabric-server): lint, security, the Linux and Windows
# test legs (race detector on, the end-to-end test on fabrictest included;
# macOS runs nightly), coverage
# (the per-package floors), build, web (svelte-check, vitest, the build,
# the byte-identical dist guard and the bundled-package notices), e2e-web
# (a Playwright smoke per page in Chromium against the Go e2e server) and
# contract (fixture use on both sides, no removal against the last
# release). No fuzz-smoke job: the module has no decoder of its own; the
# request bodies are encoding/json with DisallowUnknownFields and a size
# bound.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.27.4"
  # Pinned, not @latest: a tool release must not turn an unrelated pull
  # request red. Keep in step with `make setup`.
  GOFUMPT_VERSION: "v0.12.0"
  GOLANGCI_LINT_VERSION: "v2.14.0"
  GOVULNCHECK_VERSION: "v1.8.0"
  GOLICENSES_VERSION: "v1.6.0"
  # The Node.js the committed bundle is built with; dist-check rebuilds on
  # the same one, so a bump is a commit that also rebuilds fabricui/dist.
  NODE_VERSION: "22.22.1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@${{ env.GOFUMPT_VERSION }}
          make fmt-check
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          golangci-lint config verify
          golangci-lint run --timeout=5m ./...
      - name: go.mod tidiness
        run: make tidy-check
      - name: generated handlers (internal/api is the generation of the contract)
        run: make generate-check

  security:
    name: security (vuln + licenses + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          make vuln
      - name: go-licenses
        run: |
          go install github.com/google/go-licenses@${{ env.GOLICENSES_VERSION }}
          make licenses
      - name: gitleaks
        run: make secrets

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS is not in this matrix: it runs nightly (nightly.yml), as in
    # go-fabric. GitHub's hosted macOS arm64 pool is capacity-constrained;
    # three of four `test (macos-latest)` jobs in November 2026 were never
    # acquired by a runner and were cancelled by GitHub after 15 minutes
    # without a single step ("The job was not acquired by Runner of type
    # hosted even after multiple attempts"), which blocked every pull
    # request (issue #40). The go test timeout (600 s) prints a goroutine
    # dump on a real hang; the job timeout is above it so the dump lands.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout=600s ./...

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build
        run: make build
      - name: build (32-bit, the armv7 add-on and arm/386 hosts of the consumers)
        run: GOARCH=386 make build

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: cover-check
        run: make cover-check

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm ci
        run: make web-install
      - name: svelte-check + vitest
        run: make web-check
      - name: dist-check (the committed bundle is the build of this tree)
        run: make dist-check
      - name: notices-check (every bundled package is in THIRD-PARTY-NOTICES.md)
        run: make notices-check
      - name: version-check
        run: make version-check

  e2e-web:
    name: e2e-web (Playwright smoke, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm ci
        run: make web-install
      # The browser is keyed by the lockfile, which pins @playwright/test.
      - name: Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
      - name: Chromium's system libraries
        run: cd ui && npx playwright install-deps chromium
      - name: browser smoke per page
        run: make e2e-web

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm ci
        run: make web-install
      - name: openapi guard and fixture use (Go and TypeScript)
        run: make contract-check
