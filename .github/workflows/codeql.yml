name: codeql

# CodeQL static analysis (SAST) of both halves, Go and the web half's
# TypeScript and Svelte. Complements gosec/govulncheck with
# data-flow and taint analysis (injection, crypto misuse, …). Findings
# surface in the repository's Security → Code scanning tab; the job does
# not fail the build on alerts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1" # weekly Monday 03:23 UTC

permissions:
  contents: read
  security-events: write # required to upload CodeQL results

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.4"

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go's CodeQL extractor requires a real compile (build-mode: none
          # is rejected for Go). autobuild runs the module's `go build` —
          # the same assumption the `build` CI job already relies on.
          - language: go
            build-mode: autobuild
          # The web half (ui/: TypeScript and Svelte, the committed bundle
          # excluded by the config below) is analysed from source.
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: matrix.language == 'go'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              - fabricui/dist
              - ui/node_modules
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
