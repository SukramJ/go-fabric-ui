version: 2
updates:
  # Go modules (root)
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - "SukramJ"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Bundle minor/patch bumps into one PR; majors stay individual so
      # they get a focused review.
      go-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions (pinned by commit SHA; Dependabot bumps the SHA and
  # keeps the `# vX` version comment in sync).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    reviewers:
      - "SukramJ"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]

  # npm (the Svelte library and the shell). Every bump rebuilds the
  # committed bundle: dist-check fails until fabricui/dist is rebuilt in
  # the same pull request.
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - "SukramJ"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 (the Go-native compiler) is not supported yet by the
      # tools that drive it here: svelte-check 4.7 accepts TypeScript 5/6
      # only (TS 7 needs a side-by-side TS 6 install and --tsgo), and
      # openapi-typescript 7.13 declares typescript ^5.x. Lift this once
      # both support TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
